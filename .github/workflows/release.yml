name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      BUILD_CMD: ${{ matrix.build_cmd }}
      TARGET: ${{ matrix.target }}
      # electron-builder 直接发布到 GitHub Release（需要 GH_TOKEN）
      # 第一个平台创建 Release，后续平台追加 assets
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            build_cmd: build:linux
          - os: windows-latest
            target: win
            build_cmd: build:win
          - os: macos-latest
            target: mac
            build_cmd: build:mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package
        run: pnpm $BUILD_CMD
